
!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pusat Toko Perabot Pro</title>
  <!-- SDK Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background: #f4f4f9; color: #333; }
    h1 { font-size: 20px; color: #2e3650; margin-bottom: 5px; }
    .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
    button, .btn { padding: 10px; background: #3498db; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; text-align: center; }
    button:active { background: #230089; }
    .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
    input, select { width: 100%; padding: 8px; margin: 5px 0 12px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
    .history-item { padding: 10px; border-bottom: 1px solid #eee; font-size: 14px; background: #fafafa; margin-bottom: 5px; border-radius: 4px; }
    .search-box { background: #eef2f7; border-left: 4px solid #3498db; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
  </style>
</head>
<body>

  <h1>Pusat Toko Perabot Pro</h1>
  <p style="font-size: 13px; color: #666;">Kasir, Cicilan, Stok, Katalog, Supplier & Kurir</p>

  <!-- Menu Navigasi Cepat -->
  <div class="menu-grid">
    <button onclick="gantiTab('kas')">🛒 Kas</button>
    <button onclick="gantiTab('cicilan')">📋 Cicilan</button>
    <button onclick="gantiTab('stok')">📦 Stok</button>
    <button onclick="gantiTab('katalog')">📁 Katalog</button>
    <button onclick="gantiTab('supplier')">🏭 Pemasok</button>
    <button onclick="gantiTab('kurir')">🚚 Kurir</button>
  </div>

  <!-- TAB KAS -->
  <div id="tab-kas" class="card">
    <h3>Catat Transaksi Kas Harian</h3>
    <label>Uang Masuk / Penjualan (Rp):</label>
    <input type="number" id="inputKasMasuk" placeholder="Contoh: 500000">
    <label>Keterangan / Nama Barang:</label>
    <input type="text" id="inputKetKas" placeholder="Contoh: Penjualan lemari">
    <button onclick="simpanKas()">💾 Simpan Kas</button>
    <h4>Riwayat Kas & Nota</h4>
    <div id="listRiwayatKas">Belum ada catatan.</div>
  </div>

  <!-- TAB CICILAN -->
  <div id="tab-cicilan" class="card" style="display: none;">
    <h3>Tambah Buku Cicilan Baru</h3>
    <label>Nama Pelanggan:</label>
    <input type="text" id="cicilanNama" placeholder="Nama Pelanggan">
    <label>No WA (Cth: 08123456789):</label>
    <input type="text" id="cicilanHp" placeholder="No WA (Cth: 08123456789)">
    <label>Nama Barang (Cth: Kasur Busa):</label>
    <input type="text" id="cicilanBarang" placeholder="Nama Barang (Cth: Kasur Busa)">
    <label>Total Tagihan / Plafon (Rp):</label>
    <input type="number" id="cicilanNominal" placeholder="Total Tagihan / Plafon (Rp)">
    <button style="background: #27ae60; width: 100%; font-size: 15px; margin-bottom: 15px;" onclick="buatBukuCicilan()">📦 Buat Buku Cicilan</button>
    
    <h4>Daftar Buku Tagihan Pelanggan</h4>
    
    <!-- Kotak Pencarian Pelanggan -->
    <div class="search-box">
      <label style="font-size: 13px; font-weight: bold; color: #2e3650;">🔍 Cari Nama / Barang Pelanggan:</label>
      <input type="text" id="inputCariPelanggan" placeholder="Ketik nama pelanggan (misal: Ani)..." oninput="filterDataCicilan()">
    </div>

    <div id="listCicilanPelanggan">Memuat data dari database...</div>
  </div>

  <script>
    // Konfigurasi Firebase Proyek Anda
    const firebaseConfig = {
      databaseURL: "https://toko-perabot-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let cacheDataCicilan = {};

    function gantiTab(tab) {
      document.getElementById('tab-kas').style.display = (tab === 'kas') ? 'block' : 'none';
      document.getElementById('tab-cicilan').style.display = (tab === 'cicilan') ? 'block' : 'none';
    }

    // Fungsi Simpan Buku Cicilan
    function buatBukuCicilan() {
      const nama = document.getElementById('cicilanNama').value.trim();
      const hp = document.getElementById('cicilanHp').value.trim();
      const barang = document.getElementById('cicilanBarang').value.trim();
      const nominal = document.getElementById('cicilanNominal').value.trim();

      if (!nama || !nominal) {
        alert("Nama pelanggan dan nominal wajib diisi!");
        return;
      }

      const dataBaru = {
        nama: nama,
        hp: hp,
        barang: barang,
        nominal: Number(nominal),
        tanggal: new Date().toLocaleDateString('id-ID')
      };

      db.ref('cicilan').push(dataBaru)
        .then(() => {
          alert("Buku cicilan berhasil dibuat dan disimpan!");
          document.getElementById('cicilanNama').value = '';
          document.getElementById('cicilanHp').value = '';
          document.getElementById('cicilanBarang').value = '';
          document.getElementById('cicilanNominal').value = '';
        })
        .catch((error) => {
          alert("Gagal menyimpan ke database: " + error.message);
        });
    }

    // Memuat otomatis data cicilan saat halaman dibuka
    window.addEventListener('DOMContentLoaded', () => {
      db.ref('cicilan').on('value', (snapshot) => {
        cacheDataCicilan = snapshot.val() || {};
        tampilkanDataCicilan(cacheDataCicilan);
      }, (error) => {
        document.getElementById('listCicilanPelanggan').innerHTML = "Gagal memuat data: " + error.message;
      });
    });

    // Fungsi Render Daftar Cicilan ke HTML
    function tampilkanDataCicilan(data) {
      const daftarDiv = document.getElementById('listCicilanPelanggan');
      if (!data || Object.keys(data).length === 0) {
        daftarDiv.innerHTML = "Belum ada data cicilan.";
        return;
      }
      let html = "";
      for (let id in data) {
        let item = data[id];
        html += `<div class="history-item">
          <strong>${item.nama}</strong> (${item.hp || '-' })<br>
          Barang: ${item.barang || '-'} | Rp ${Number(item.nominal).toLocaleString('id-ID')}<br>
          <small>Tanggal: ${item.tanggal || '-'}</small>
        </div>`;
      }
      daftarDiv.innerHTML = html;
    }

    // Fungsi Filter/Pencarian Pelanggan secara Instan
    function filterDataCicilan() {
      const keyword = document.getElementById('inputCariPelanggan').value.toLowerCase();
      if (!keyword) {
        tampilkanDataCicilan(cacheDataCicilan);
        return;
      }

      let filtered = {};
      for (let id in cacheDataCicilan) {
        let item = cacheDataCicilan[id];
        let namaPelanggan = (item.nama || "").toLowerCase();
        let namaBarang = (item.barang || "").toLowerCase();
        let nomorHp = (item.hp || "").toLowerCase();

        if (namaPelanggan.includes(keyword) || namaBarang.includes(keyword) || nomorHp.includes(keyword)) {
          filtered[id] = item;
        }
      }
      tampilkanDataCicilan(filtered);
    }

    function simpanKas() {
      alert("Fitur kas siap digunakan!");
    }
  </script>
</body>
</html>
